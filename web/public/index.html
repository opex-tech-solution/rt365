<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposal Builder · RegTech365</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#10233f;--navy2:#1b3558;--gold:#b8902f;--gold-soft:#f3ead2;--bg:#f2f4f8;--card:#fff;--ink:#14213a;--mut:#5d6b82;--line:#dfe4ec;--ok:#1d7a4d;--err:#b42318;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0c1524;--card:#13213a;--ink:#e8edf6;--mut:#9aa8c0;--line:#243452;--gold-soft:#3a3118}}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#e8edf6;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:600 18px Newsreader,serif}
.brand b{display:block;font-weight:600}.brand small{color:#9fb0cb}
.ref{margin:0 6px;padding:12px 14px;border:1px solid #2c4468;border-radius:var(--r);background:var(--navy2)}
.ref small{color:#9fb0cb;display:block}.ref code{font:500 14px "IBM Plex Sans";color:#f3d98a;word-break:break-all}
.bar{height:6px;border-radius:3px;background:#2c4468;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.pct{font-size:12px;color:#9fb0cb;margin-top:4px}
#nav{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border:0;border-radius:8px;background:none;color:#cbd6e8;cursor:pointer}
.step:hover{background:#1b3558}.step.on{background:#fff;color:var(--navy)}
.step b{display:block;font-weight:600;line-height:1.2}.step small{font-size:12px;opacity:.75}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #4a6790;display:grid;place-items:center;font-size:12px;font-weight:600}
.step.on .dot{border-color:var(--navy)}.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}.dot.warn{border-color:#f0a43a;color:#f0a43a}
.access{margin-top:auto;padding:0 6px}.access label{font-size:12px;color:#9fb0cb;display:block;margin-bottom:4px}
.access input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #2c4468;background:var(--navy2);color:#fff}
.reset{background:none;border:0;color:#9fb0cb;font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0}
main{padding:36px clamp(18px,4vw,56px) 110px;max-width:980px;width:100%}
.ph h2{font:600 32px/1.15 Newsreader,serif;margin:0 0 4px}.ph p{margin:0 0 22px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.wide{grid-column:1/-1}
.f span{display:block;font-size:13px;font-weight:500;margin-bottom:4px}.f i{color:var(--err);font-style:normal;margin-left:3px}
.f input,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mod{display:flex;gap:10px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left}
.mod .chk{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:13px;color:transparent}
.mod.on{border-color:var(--gold);background:var(--gold-soft)}.mod.on .chk{background:var(--navy);border-color:var(--navy);color:#fff}
.mod.on{color:#14213a}@media(prefers-color-scheme:dark){.mod.on{color:#f3e7c2}}
.note{color:var(--mut);font-size:13px;margin:-6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{display:block;font:600 28px Newsreader,serif}.stat span{color:var(--mut);font-size:13px}
.miss{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.miss:first-of-type{border-top:0}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-weight:500}@media(prefers-color-scheme:dark){.link{color:#f3d98a}}
.ok{border-color:var(--ok)}.ok h3{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:8px;border:1.5px solid var(--navy);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none;color:var(--navy);display:inline-block}
@media(prefers-color-scheme:dark){.btn{color:var(--ink);border-color:var(--mut)}}
.btn.pri{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#14213a}.btn[disabled]{opacity:.45;cursor:not-allowed}
.foot{position:fixed;left:320px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px clamp(18px,4vw,56px);display:flex;justify-content:space-between;gap:10px}
#busy{position:fixed;inset:0;background:rgba(10,20,38,.72);display:none;place-items:center;z-index:9;padding:20px}
#busy.on{display:grid}#busy div{background:var(--card);padding:28px;border-radius:var(--r);max-width:380px;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;top:16px;right:16px;background:var(--err);color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:10;max-width:380px}
@media(max-width:860px){.app{display:block}.rail{position:static;height:auto}#nav{flex-direction:row;overflow:auto}.step small{display:none}.foot{left:0}.grid,.stats{grid-template-columns:1fr}.access{margin-top:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
 <aside class="rail">
  <div class="brand"><div class="mark">R</div><div><b>RegTech365</b><small>Proposal builder</small></div></div>
  <div class="ref"><small>Document reference</small><code id="ref">RT365-…-2026-000</code><div class="bar"><i id="bar"></i></div><div class="pct" id="pct">0% complete</div></div>
  <nav id="nav" aria-label="Proposal sections"></nav>
  <div class="access"><label for="code">Access code</label><input id="code" type="password" autocomplete="off" placeholder="Enter your team code"><button class="reset" id="reset">Clear saved draft</button></div>
 </aside>
 <main id="main"><div class="card">Loading the form…</div></main>
</div>
<div class="foot" id="foot"></div>
<div id="busy"><div><div class="spin"></div><b>Building your proposal</b><p style="color:var(--mut);margin:6px 0 0">This usually takes under 30 seconds. If the server was asleep, the first run can take up to a minute.</p></div></div>
<div id="toast" role="alert"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='rt365_draft_v1';let S,V={},mods=['regcomply'],drop=[],step=0,STEPS=[],result=null;
const BASE=[
 {t:'Scope',s:'Modules and optional slides',kind:'scope'},
 {t:'Client and document',s:'Cover, control, contact',g:['Cover','Document control','Contact']},
 {t:'Executive summary',s:'Summary and key figures',g:['Executive summary','At a glance']},
 {t:'Understanding the client',s:'Strengths, priorities, regulation',g:['Understanding','Client priorities','Regulatory context']},
 {t:'Proposed solution',s:'Mapping, scope, assurance',g:['Priority mapping','Scope: in scope','Scope: client responsibilities','Assurance']},
 {t:'Delivery and value',s:'Plan, team, outcomes',g:['Implementation','Implementation phases','Governance','Outcome measures','Business case']},
 {t:'Commercials and close',s:'Pricing, proof, next steps',g:['Commercials: modules','Commercials: totals & terms','Why RegTech365: proof points','Next steps','Key assumptions']}];
const filled=f=>!!String(V[f.key]||'').trim(),fieldsOf=st=>S.fields.filter(f=>st.g.includes(f.group));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({V,mods,drop}))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',6000)};
const code=()=>$('#code').value.trim();
async function init(){
 try{const r=await fetch('/api/proxy?op=fields');if(!r.ok)throw 0;S=await r.json()}
 catch(e){$('#main').innerHTML='<div class="card"><h3>The form could not load</h3><p>The server may be waking up. Wait a few seconds, then try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>';return}
 S.fields.forEach(f=>{if(f.def)V[f.key]=f.def});
 try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){V={...V,...d.V};mods=d.mods||mods;drop=d.drop||drop}}catch(e){}
 const known=BASE.flatMap(b=>b.g||[]),groups=[...new Set(S.fields.map(f=>f.group))],extra=groups.filter(g=>!known.includes(g));
 STEPS=BASE.map(b=>b.g?{...b,g:b.g.filter(g=>groups.includes(g))}:b);
 if(extra.length)STEPS.push({t:'More details',s:'Additional fields',g:extra});
 STEPS.push({t:'Review and generate',s:'Check, then create',kind:'review'});
 draw()}
function draw(){nav();main()}
function nav(){
 $('#nav').innerHTML=STEPS.map((st,i)=>{const fs=st.g?fieldsOf(st):[],n=fs.filter(filled).length,miss=fs.some(f=>f.req&&!filled(f));
  const meta=st.kind==='scope'?`${mods.length} module${mods.length==1?'':'s'} selected`:st.kind==='review'?'Check and create':`${n} of ${fs.length} filled`;
  const cls=st.g?(miss?'warn':n&&n==fs.length?'done':''):'';
  return `<button class="step ${i==step?'on':''}" data-step="${i}"><span class="dot ${cls}">${cls=='done'?'✓':i+1}</span><span><b>${st.t}</b><small>${meta}</small></span></button>`}).join('');
 const tot=S.fields.length,done=S.fields.filter(filled).length,p=Math.round(done/tot*100);
 $('#bar').style.width=p+'%';$('#pct').textContent=p+'% of fields filled';
 $('#ref').textContent=`RT365-${(V.client_code||'…').toUpperCase()}-${new Date().getFullYear()}-000`}
const fieldHtml=f=>`<label class="f ${f.area?'wide':''}"><span>${esc(f.label)}${f.req?'<i>*</i>':''}</span>${f.area?`<textarea rows="3" data-k="${f.key}">${esc(V[f.key])}</textarea>`:`<input data-k="${f.key}" value="${esc(V[f.key])}">`}</label>`;
function main(){
 const st=STEPS[step];let h=`<header class="ph"><h2>${st.t}</h2><p>${st.s}</p></header>`;
 if(st.kind==='scope'){
  h+=`<section class="card"><h3>Modules in scope</h3><p class="note">Tiles and logos for modules you leave unticked are removed from the proposal.</p><div class="mods">${Object.entries(S.modules).map(([k,l])=>`<button class="mod ${mods.includes(k)?'on':''}" data-mod="${k}"><span class="chk">✓</span><b>${esc(l)}</b></button>`).join('')}</div></section>
  <section class="card"><h3>Slides to leave out</h3><p class="note">Tick any optional slide you want removed to shorten the proposal.</p><div class="mods">${Object.entries(S.droppable).map(([k,l])=>`<button class="mod ${drop.includes(+k)?'on':''}" data-drop="${k}"><span class="chk">✓</span><b>${esc(l)}</b></button>`).join('')}</div></section>`}
 else if(st.kind==='review'){
  const miss=S.fields.filter(f=>f.req&&!filled(f)),n=S.fields.filter(filled).length;
  if(result)h+=`<section class="card ok"><h3>Your proposal is ready</h3><p>It was saved to your proposals folder. Open it to review and edit, or download a PDF.</p><div class="actions"><a class="btn gold" href="${esc(result.editUrl)}" target="_blank" rel="noopener">Open in Google Slides</a><a class="btn" href="/api/proxy?op=pdf&id=${encodeURIComponent(result.id)}&code=${encodeURIComponent(code())}">Download PDF</a><button class="btn" data-new>Start a new proposal</button></div></section>`;
  h+=`<section class="card"><h3>Summary</h3><div class="stats"><div class="stat"><b>${n}</b><span>of ${S.fields.length} fields filled</span></div><div class="stat"><b>${mods.length}</b><span>modules in scope</span></div><div class="stat"><b>${drop.length}</b><span>slides left out</span></div></div></section>
  <section class="card"><h3>${miss.length?'Required fields still empty':'Ready to generate'}</h3>${miss.length?miss.map(f=>`<div class="miss"><span>${esc(f.label)}</span><button class="link" data-jump="${STEPS.findIndex(s=>s.g&&s.g.includes(f.group))}">Fill in</button></div>`).join(''):'<p style="margin:0;color:var(--mut)">All required fields are filled. Fields you leave empty will be blank in the proposal, so check the optional ones too.</p>'}</section>`}
 else h+=st.g.map(g=>`<section class="card"><h3>${esc(g)}</h3><div class="grid">${S.fields.filter(f=>f.group===g).map(fieldHtml).join('')}</div></section>`).join('');
 $('#main').innerHTML=h;
 const last=step==STEPS.length-1,miss=S.fields.some(f=>f.req&&!filled(f));
 $('#foot').innerHTML=`<button class="btn" data-back ${step?'':'disabled'}>Back</button>`+(last?`<button class="btn pri" data-gen ${miss?'disabled':''}>Generate proposal</button>`:`<button class="btn pri" data-next>Continue</button>`);
 window.scrollTo(0,0)}
const go=i=>{step=Math.max(0,Math.min(STEPS.length-1,i));draw()};
const tog=(a,x)=>a.includes(x)?a.filter(i=>i!==x):[...a,x];
document.addEventListener('click',e=>{const t=e.target.closest('[data-step],[data-mod],[data-drop],[data-next],[data-back],[data-gen],[data-jump],[data-new]');if(!t)return;const d=t.dataset;
 if('step'in d)go(+d.step);else if('jump'in d)go(+d.jump);else if('next'in d)go(step+1);else if('back'in d)go(step-1);
 else if('mod'in d){mods=tog(mods,d.mod);save();draw()}else if('drop'in d){drop=tog(drop,+d.drop);save();draw()}
 else if('gen'in d)generate();else if('new'in d){result=null;go(0)}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){V[k]=e.target.value;save();nav()}});
$('#reset').onclick=()=>{if(confirm('Clear everything you have entered?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
async function generate(){
 const miss=S.fields.filter(f=>f.req&&!filled(f));if(miss.length)return toast('Fill the required fields first.');
 $('#busy').classList.add('on');
 try{const r=await fetch('/api/proxy',{method:'POST',headers:{'content-type':'application/json','x-access-code':code()},body:JSON.stringify({fields:V,modules:mods,dropSlides:drop})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status==401?'Wrong or missing access code.':(j.detail||'The server could not build the proposal. Wait a minute and try again.'));
  result=j;draw()}
 catch(e){toast(e.message)}finally{$('#busy').classList.remove('on')}}
init();
</script></body></html>
